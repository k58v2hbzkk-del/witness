name: record-simulator
# Runs Witness in the Even Hub simulator against the live server (real Polymarket data)
# and commits the recording to a `recordings` branch.
on:
  workflow_dispatch:
    inputs:
      minutes: { description: 'minutes to record', default: '25' }
      query: { description: 'team or game to watch (optional)', default: '' }
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb ffmpeg libwebkit2gtk-4.1-0 libgtk-3-0 gstreamer1.0-plugins-base gstreamer1.0-gl >/dev/null
      - run: cd glasses && npm ci --no-audit --no-fund
      - name: wake the server
        run: for i in 1 2 3 4 5 6; do curl -fsS -m 60 https://witness-rjya.onrender.com/api/health && break; sleep 10; done
      - name: record
        env: { MINUTES: '${{ inputs.minutes }}', QUERY: '${{ inputs.query }}' }
        run: |
          Xvfb :99 -screen 0 1280x800x24 & sleep 2
          export DISPLAY=:99 WEBKIT_DISABLE_COMPOSITING_MODE=1
          glasses/node_modules/@evenrealities/sim-linux-x64/bin/evenhub-simulator https://witness-rjya.onrender.com/app/ --automation-port 9898 > sim.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:9898/api/screenshot/glasses && break; sleep 2; done
          mkdir -p rec && cd rec && python3 ../tools/record.py
      - name: encode
        run: |
          cd rec
          python3 - <<'PY'
          import json
          d = json.load(open('frames.json'))['frames']
          L = []
          for k, (i, t) in enumerate(d):
              dur = (d[k+1][1] - t) if k + 1 < len(d) else 0.2
              L.append(f"file 'frames/f{i:06d}.png'\nduration {dur:.3f}")
          open('list.txt', 'w').write('\n'.join(L))
          PY
          ffmpeg -v error -y -f concat -i list.txt -vf "fps=30,scale=1152:576:flags=neighbor,format=yuv420p" -c:v libx264 -crf 14 -preset veryfast glasses-live.mp4
          rm -rf frames list.txt
      - name: save to the recordings branch
        run: |
          cp sim.log rec/ || true
          git config user.name rec-bot && git config user.email rec-bot@users.noreply.github.com
          git checkout -q --orphan rec-${{ github.run_id }}
          git rm -rqf --cached .
          git add -f rec
          git commit -qm "simulator recording ${{ github.run_id }}"
          git push -q origin HEAD:refs/heads/rec-${{ github.run_id }}
